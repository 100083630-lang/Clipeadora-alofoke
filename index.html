
<!doctype html><html lang=es><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>CLIPALOFOKE</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#0a0a0a] text-white p-4 font-sans"><h1 class="text-xl font-black">CLIP<span class=text-[#e11d48]>ALOFOKE</span></h1><div class="bg-[#18181b] rounded-2xl p-4 mt-4"><input type=file id=v accept=video/* hidden><div id=drop class="border-2 border-dashed border-zinc-700 rounded-2xl h-40 grid place-items-center text-center p-4">📁<br>Suelta tu video<br><small class=text-zinc-500>o toca aqui</small></div><video id=p controls class="hidden w-full mt-3 rounded-xl"></video><button id=x class="bg-[#e11d48] w-full mt-4 py-3 rounded-full font-black">EXPORTAR CLIP 9:16</button></div><script>const drop=document.getElementById('drop'),p=document.getElementById('p'),v=document.getElementById('v');drop.onclick=()=>v.click();v.onchange=e=>{const f=e.target.files[0];if(f){p.src=URL.createObjectURL(f);p.classList.remove('hidden');drop.classList.add('hidden')}};drop.ondragover=e=>e.preventDefault();drop.ondrop=e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f){p.src=URL.createObjectURL(f);p.classList.remove('hidden');drop.classList.add('hidden')}};document.getElementById('x').onclick=()=>{if(!p.src){alert('Sube un video primero');return}alert('🚀 Clip listo para TikTok!')}</script></body></html>
