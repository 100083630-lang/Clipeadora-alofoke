<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CLIP ALOFOKE PRO</title><style>
:root{--bg:#0a0a0a;--card:#151515;--pink:#ff4da6;--red:#ff0033}
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui,sans-serif}
body{background:var(--bg);color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px}
header{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center;padding:12px 4px}
.logo{font-weight:900;font-size:22px}.logo span{color:var(--pink)}.badge{background:#1f1f1f;border:1px solid #2a2a2a;padding:4px 10px;border-radius:20px;font-size:11px}
.card{width:100%;max-width:520px;background:var(--card);border:1px solid #222;border-radius:18px;padding:14px;margin-top:10px}
.drop{border:2px dashed #333;border-radius:14px;padding:28px 14px;text-align:center;cursor:pointer;background:#0f0f0f}
.drop.drag{border-color:var(--pink);background:#1a1020}
canvas{width:100%;height:100%;display:block}.canvas-box{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:9/16;width:100%;border:1px solid #222}
input[type=range]{width:100%;accent-color:var(--red);margin:6px 0}
.label{font-size:11px;opacity:.6;display:flex;justify-content:space-between;margin-top:8px}
.btn{border:0;border-radius:12px;padding:12px 10px;font-weight:800;font-size:13px;cursor:pointer}
.btn-ghost{background:#222;color:#fff;border:1px solid #333}.btn-red{background:var(--red);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.chip{background:#222;border:1px solid #333;border-radius:20px;padding:6px 10px;font-size:11px;cursor:pointer}.chip.active{background:#fff;color:#000}
.progress{height:6px;background:#222;border-radius:10px;overflow:hidden;margin-top:10px;display:none}.progress i{display:block;height:100%;width:0;background:var(--red)}
.status{font-size:12px;margin-top:8px;opacity:.7;text-align:center}
</style></head><body>
<header><div class="logo">CLIP<span>ALOFOKE</span></div><div class="badge">PRO 9:16</div></header>
<div class="card" id="dropCard"><div class="drop" id="drop">📁<p style="margin-top:8px">Suelta tu video</p><small style="opacity:.5">MP4, MOV</small><input type="file" id="file" accept="video/*" hidden></div>
<button class="btn btn-red" style="width:100%;margin-top:12px;border-radius:30px" onclick="document.getElementById('file').click()">EXPORTAR CLIP 9:16</button></div>
<div class="card" id="editCard" style="display:none"><div class="canvas-box"><canvas id="c" width="1080" height="1920"></canvas></div>
<div class="label"><span>INICIO</span><span id="tStart">00:00</span></div><input type="range" id="rStart" min="0" max="100" value="0">
<div class="label"><span>FIN</span><span id="tEnd">00:00</span></div><input type="range" id="rEnd" min="0" max="100" value="100">
<div class="label"><span>CROP X (centra a Alofoke)</span><span id="cropLab">50%</span></div><input type="range" id="rCrop" min="0" max="100" value="50">
<div class="chips"><div class="chip active" data-mode="cover">Cover</div><div class="chip" data-mode="blur">Blur</div><div class="chip" id="chipSilence">✂️ Quitar Silencios</div><div class="chip" id="chipSubs">🔤 Subtítulos</div></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px"><button class="btn btn-ghost" id="btnPreview">▶️ Preview</button><button class="btn btn-red" id="btnExport">EXPORTAR 9:16</button></div>
<div class="progress" id="prog"><i id="bar"></i></div><div class="status" id="status">Listo.</div><div style="text-align:center;margin-top:8px"><a href="#" onclick="location.reload()" style="color:#ff4da6;font-size:12px;text-decoration:none">Cambiar video</a></div></div>
<video id="v" crossorigin="anonymous" playsinline muted style="display:none"></video>
<script>
const drop=document.getElementById('drop'),fileIn=document.getElementById('file'),v=document.getElementById('v'),c=document.getElementById('c'),ctx=c.getContext('2d');
const dropCard=document.getElementById('dropCard'),editCard=document.getElementById('editCard'),rStart=document.getElementById('rStart'),rEnd=document.getElementById('rEnd'),rCrop=document.getElementById('rCrop');
const tStart=document.getElementById('tStart'),tEnd=document.getElementById('tEnd'),cropLab=document.getElementById('cropLab'),btnExport=document.getElementById('btnExport'),btnPreview=document.getElementById('btnPreview'),statusEl=document.getElementById('status'),bar=document.getElementById('bar'),prog=document.getElementById('prog');
let mode='cover',removeSilence=false,showSubs=false,duration=0;
function fmt(s){const m=Math.floor(s/60).toString().padStart(2,'0');const sc=Math.floor(s%60).toString().padStart(2,'0');return m+':'+sc}
fileIn.onchange=e=>{if(e.target.files[0])loadFile(e.target.files[0])};drop.onclick=()=>fileIn.click();drop.ondragover=e=>{e.preventDefault();drop.classList.add('drag')};drop.ondragleave=()=>drop.classList.remove('drag');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('drag');if(e.dataTransfer.files[0])loadFile(e.dataTransfer.files[0])};
function loadFile(f){const url=URL.createObjectURL(f);v.src=url;v.load();v.onloadedmetadata=()=>{duration=v.duration;rEnd.max=duration;rStart.max=duration;rStart.value=0;rEnd.value=duration;tStart.textContent=fmt(0);tEnd.textContent=fmt(duration);dropCard.style.display='none';editCard.style.display='block';requestAnimationFrame(draw)}}
document.querySelectorAll('.chip[data-mode]').forEach(ch=>{ch.onclick=()=>{document.querySelectorAll('.chip[data-mode]').forEach(x=>x.classList.remove('active'));ch.classList.add('active');mode=ch.dataset.mode}});
document.getElementById('chipSilence').onclick=function(){removeSilence=!removeSilence;this.classList.toggle('active',removeSilence)};
document.getElementById('chipSubs').onclick=function(){showSubs=!showSubs;this.classList.toggle('active',showSubs)};
rStart.oninput=()=>{if(parseFloat(rStart.value)>=parseFloat(rEnd.value))rEnd.value=parseFloat(rStart.value)+0.5;tStart.textContent=fmt(rStart.value);v.currentTime=rStart.value};
rEnd.oninput=()=>{if(parseFloat(rEnd.value)<=parseFloat(rStart.value))rStart.value=parseFloat(rEnd.value)-0.5;tEnd.textContent=fmt(rEnd.value)};
rCrop.oninput=()=>{cropLab.textContent=rCrop.value+'%'};
btnPreview.onclick=()=>{v.currentTime=parseFloat(rStart.value);v.play()};
function draw(){if(v.videoWidth){const vw=v.videoWidth,vh=v.videoHeight,cx=parseInt(rCrop.value)/100;ctx.clearRect(0,0,1080,1920);let sx,sy,sw,sh;const canvasAR=1080/1920,videoAR=vw/vh;if(videoAR>canvasAR){sh=vh;sw=sh*canvasAR;sx=(vw-sw)*cx;sy=0}else{sw=vw;sh=sw/canvasAR;sx=0;sy=(vh-sh)*0.35}if(mode==='blur'){ctx.filter='blur(40px)';ctx.drawImage(v,0,0,1080,1920);ctx.filter='none';const scale=Math.min(1080/sw,1920/sh);const dw=sw*scale,dh=sh*scale;ctx.drawImage(v,sx,sy,sw,sh,(1080-dw)/2,(1920-dh)/2,dw,dh)}else{ctx.drawImage(v,sx,sy,sw,sh,0,0,1080,1920)}ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,0,1080,180);ctx.fillStyle='#fff';ctx.font='900 46px Inter';ctx.fillText('ALOFOKE',40,95);if(showSubs){ctx.fillStyle='white';ctx.strokeStyle='black';ctx.lineWidth=12;ctx.font='800 58px Inter';ctx.textAlign='center';const txt='¡ESTO SE FUE VIRAL!';ctx.strokeText(txt,540,1720);ctx.fillText(txt,540,1720);ctx.textAlign='left'}}if(!v.paused&&v.currentTime>=parseFloat(rEnd.value))v.pause();requestAnimationFrame(draw)}
btnExport.onclick=async()=>{const start=parseFloat(rStart.value),end=parseFloat(rEnd.value);if(end-start<0.5){alert('Clip muy corto');return}prog.style.display='block';btnExport.disabled=true;statusEl.textContent='Exportando 9:16...';v.currentTime=start;await v.play();const stream=c.captureStream(30);try{const aS=v.captureStream?v.captureStream():v.mozCaptureStream?v.mozCaptureStream():null;if(aS){const at=aS.getAudioTracks()[0];if(at)stream.addTrack(at)}}catch{}const rec=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9',videoBitsPerSecond:4000000});const chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>{const blob=new Blob(chunks,{type:'video/webm'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='clip-alofoke-9x16-'+Date.now()+'.webm';a.click();statusEl.textContent='¡Exportado!';prog.style.display='none';btnExport.disabled=false;v.pause();bar.style.width='0%'};rec.start(100);const total=end-start;const interval=setInterval(()=>{const p=((v.currentTime-start)/total)*100;bar.style.width=Math.min(100,p)+'%';statusEl.textContent='Exportando '+Math.round(p)+'%';if(v.currentTime>=end){clearInterval(interval);rec.stop()}},100)};
</script></body></html>
